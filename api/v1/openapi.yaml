components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен, полученный из `/auth/login` или `/auth/refresh`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        HttpOnly-cookie с refresh-токеном, устанавливается в `/auth/login` и `/auth/refresh`.
        Браузер отправляет её автоматически на пути `/api/v1/auth/*` (для cross-origin запросов
        нужен `credentials: "include"`).
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          maxLength: 100
          example: Иван Иванов
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Не менее 8 символов и не более 72 **байт** (ограничение bcrypt).
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
          example: secret123
    UpdateProfileRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
          example: new@example.com
        name:
          type: string
          maxLength: 100
          example: Иван Петров
    UpdatePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          example: secret123
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Не менее 8 символов и не более 72 **байт** (ограничение bcrypt).
          example: newsecret456
    ProfileResponse:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/User'
      required:
        - profile
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Иван Иванов
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - created_at
        - updated_at
    TokenPair:
      type: object
      description: |
        Ответ с access-токеном. Refresh-токен в теле **не возвращается**,
        он устанавливается в HttpOnly-cookie `refresh_token`.
      properties:
        access_token:
          type: string
          description: JWT для заголовка `Authorization`.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Время жизни access-токена в секундах.
          example: 900
      required:
        - access_token
        - token_type
        - expires_in
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid
        errors:
          type: object
          description: Ключ — имя поля (`email`, `name`, `password`), значение — список сообщений.
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
        - errors
    AutocompleteItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        label:
          type: string
          example: Россия
      required:
        - id
        - label
    AutocompleteResponse:
      type: object
      description: Ответ автодополнения; не привязан к конкретному справочнику.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AutocompleteItem'
      required:
        - items
    RefData:
      type: object
      description: Запись справочника (страны, языки, категории преступлений).
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - created_at
    Country:
      $ref: '#/components/schemas/RefData'
    Language:
      $ref: '#/components/schemas/RefData'
    CrimeCategory:
      $ref: '#/components/schemas/RefData'
    HairColor:
      $ref: '#/components/schemas/RefData'
    EyeColor:
      $ref: '#/components/schemas/RefData'
    CreateRefDataRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Не пустое и не состоит из одних пробелов. Уникально без учёта регистра.
          example: Россия
    PaginationResponse:
      type: object
      description: |
        Общая часть постраничных ответов. Поле `items` в этой схеме нет: OpenAPI 3.0 не поддерживает
        дженерики, поэтому конкретный ответ расширяет её через `allOf` и добавляет `items` своего типа.
      properties:
        total:
          type: integer
          description: Общее число записей с учётом фильтров (не только на текущей странице).
          example: 42
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
      required:
        - total
        - page
        - per_page
    RefDataListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RefData'
          required:
            - items
  parameters:
    Page:
      name: page
      in: query
      description: Номер страницы, начиная с 1.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Размер страницы.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Подстрока для регистронезависимого поиска по названию. Пробелы по краям обрезаются.
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Поле сортировки. По умолчанию `name`.
      required: false
      schema:
        type: string
        enum:
          - id
          - name
          - created_at
    Dir:
      name: dir
      in: query
      description: Направление сортировки. Если задан `sort`, а `dir` нет, используется `asc`.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    RefDataId:
      name: id
      in: path
      required: true
      description: Идентификатор записи справочника (положительное целое).
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1
  headers:
    SetRefreshCookie:
      description: |
        Refresh-токен в HttpOnly-cookie. `Max-Age` равен `JWT_REFRESH_TTL`,
        `Path=/api/v1/auth`, `Secure` и `SameSite` задаются конфигурацией.
      schema:
        type: string
        example: refresh_token=3q2-7wAAAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Strict
    ClearRefreshCookie:
      description: Удаление cookie с refresh-токеном (`Max-Age=0`).
      schema:
        type: string
        example: refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict
  responses:
    Unauthorized:
      description: |
        Заголовок `Authorization` отсутствует, имеет неверный формат
        (ожидается `Bearer <token>`), либо access-токен недействителен или истёк.
        Клиент должен выполнить `/auth/refresh`.
      headers:
        WWW-Authenticate:
          description: Схема аутентификации
          schema:
            type: string
            example: Bearer realm="api"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    UserNotFound:
      description: Пользователь из токена не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: User not found
    Forbidden:
      description: Заголовок `Origin` запроса не входит в список доверенных (`CORS_ALLOWED_ORIGINS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden
    InvalidBody:
      description: Тело запроса не является корректным JSON, содержит неизвестные поля или данные после JSON-объекта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Invalid request body
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Internal Server Error
    InvalidListParams:
      description: Некорректные параметры пагинации или сортировки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            page:
              summary: Некорректная страница
              value:
                message: page must be an integer
            perPage:
              summary: per_page вне допустимого диапазона
              value:
                message: per_page must be in [1,100]
            sortField:
              summary: Неизвестное поле сортировки
              value:
                message: unknown sort field password
            sortDir:
              summary: Некорректное направление
              value:
                message: 'invalid sort direction "up": must be "asc" or "desc"'
    InvalidId:
      description: Идентификатор не является положительным целым числом
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Id must be a positive integer
    RefDataValidationError:
      description: Ошибка валидации или запись с таким названием уже существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            invalid:
              summary: Пустое название
              value:
                message: The given data was invalid
                errors:
                  name:
                    - Field name is required
            exists:
              summary: Запись уже существует
              value:
                message: The given data was invalid
                errors:
                  name:
                    - ref data already exists
    RefDataInUse:
      description: Запись используется в других записях, удаление запрещено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: ref data is in use