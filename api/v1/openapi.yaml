openapi: 3.0.3
info:
  title: ICPO Backend API
  description: |
    HTTP API сервиса icpo-backend.

    ## Аутентификация

    Используется пара токенов:

    - **access_token** — JWT (HS256), живёт `JWT_ACCESS_TTL` (по умолчанию 15 минут).
      Передаётся в заголовке `Authorization: Bearer <access_token>`.
    - **refresh_token** — случайная строка, живёт `JWT_REFRESH_TTL` (по умолчанию 720 часов).
      В базе хранится только её SHA-256 хэш. Одноразовый: при каждом обновлении
      (`/auth/refresh`) выдаётся новая пара, а старый refresh-токен отзывается.

    Если отозванный refresh-токен предъявить повторно, считается, что он украден:
    отзываются **все** refresh-токены пользователя, и нужно заново войти через `/auth/login`.

    ### Код 401

    - Защищённые эндпоинты: `401` — проблема с access-токеном (отсутствует, неверный формат,
      истёк, недействителен). Клиент должен выполнить `/auth/refresh` и повторить запрос.
    - `/auth/login`: `401` — неверный email или пароль. Обновлять токены в этом случае **не нужно**,
      поэтому interceptor клиента должен исключить `/auth/*` из логики «401 → refresh».
    - `/auth/refresh`: `401` — refresh-токен недействителен, нужен повторный вход через `/auth/login`.

    Неверный старый пароль при смене пароля (`/profile/password`) возвращается как `422`,
    а не `401`, чтобы не запускать обновление токенов.

    Ошибки возвращаются в формате `{"message": "..."}`; ошибки валидации — в формате
    `{"message": "...", "errors": {"поле": ["..."]}}` со статусом `422`.
  version: 0.1.0
servers:
  - url: /
    description: Текущий хост
tags:
  - name: system
    description: Служебные эндпоинты
  - name: auth
    description: Регистрация, вход и управление токенами
  - name: profile
    description: Профиль текущего пользователя (требуется access-токен)
paths:
  /api/v1/health:
    get:
      tags:
        - system
      summary: Проверка здоровья сервиса
      description: Возвращает статус доступности сервиса.
      operationId: health
      responses:
        '200':
          description: Сервис доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Регистрация пользователя
      description: |
        Создаёт нового пользователя. Email приводится к нижнему регистру,
        пробелы по краям обрезаются. Пароль хранится в виде bcrypt-хэша.

        Токены при регистрации **не выдаются** — для их получения вызовите `/auth/login`.
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              name: Иван Иванов
              password: secret123
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - user
        '400':
          $ref: '#/components/responses/InvalidBody'
        '422':
          description: |
            Ошибка валидации или email уже занят
            (в этом случае `errors.email = ["Email already taken"]`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalid:
                  summary: Некорректные данные
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Field email must be a valid email
                      password:
                        - Field password must have at least 8 characters
                emailTaken:
                  summary: Email уже занят
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Email already taken
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Вход по email и паролю
      description: |
        Проверяет учётные данные и выдаёт пару токенов.
        Для несуществующего email и неверного пароля возвращается одинаковая
        ошибка `401`, чтобы нельзя было определить, зарегистрирован ли email.
        Этот `401` не означает протухший токен — обновлять токены не нужно.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: secret123
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid email or password
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Обновление пары токенов
      description: |
        Обменивает действующий refresh-токен на новую пару токенов.
        Использованный refresh-токен сразу отзывается (ротация).

        Возвращает `401`, если токен не найден, истёк или уже был отозван.
        Повторное предъявление **отозванного** токена приводит к отзыву всех
        refresh-токенов пользователя.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: 3q2-7wAAAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Некорректное тело запроса или пустой refresh-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    message: Invalid request body
                emptyToken:
                  value:
                    message: Empty refresh token
        '401':
          description: Refresh-токен недействителен, истёк или отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid token
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Выход (отзыв refresh-токена)
      description: |
        Отзывает переданный refresh-токен. Операция идемпотентна: если токен
        не существует или уже отозван, всё равно вернётся `204`.

        Уже выданный access-токен продолжает действовать до истечения срока жизни.
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Токен отозван (тело ответа пустое)
        '400':
          description: Некорректное тело запроса или пустой refresh-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    message: Invalid request body
                emptyToken:
                  value:
                    message: Empty refresh token
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile:
    get:
      tags:
        - profile
      summary: Получить профиль текущего пользователя
      description: Возвращает данные пользователя, чей `user_id` указан в access-токене.
      operationId: profileGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - profile
      summary: Обновить имя и email
      description: |
        Обновляет email и имя текущего пользователя. Оба поля обязательны.
        Email приводится к нижнему регистру, пробелы по краям обрезаются.
        Если email занят другим пользователем, вернётся `422` с `errors.email`.
      operationId: profileUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              email: new@example.com
              name: Иван Петров
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          description: |
            Ошибка валидации или email уже занят
            (в этом случае `errors.email = ["Email already taken"]`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalid:
                  summary: Некорректные данные
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Field email must be a valid email
                emailTaken:
                  summary: Email уже занят
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Email already taken
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile/password:
    patch:
      tags:
        - profile
      summary: Сменить пароль
      description: |
        Проверяет старый пароль, сохраняет новый (bcrypt) и отзывает
        **все** refresh-токены пользователя. После успешной смены клиенту
        нужно заново войти через `/auth/login`.

        Уже выданные access-токены продолжают действовать до истечения срока жизни.
        Неверный старый пароль возвращается как `422` с `errors.old_password`
        (а не `401`), чтобы клиент не пытался обновлять токены.
      operationId: profileUpdatePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              old_password: secret123
              new_password: newsecret456
      responses:
        '204':
          description: Пароль изменён, refresh-токены отозваны (тело ответа пустое)
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          description: Ошибка валидации или неверный старый пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalid:
                  summary: Некорректные данные
                  value:
                    message: The given data was invalid
                    errors:
                      new_password:
                        - Field new_password must have at least 8 characters
                wrongPassword:
                  summary: Неверный старый пароль
                  value:
                    message: The given data was invalid
                    errors:
                      old_password:
                        - Wrong password
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен, полученный из `/auth/login` или `/auth/refresh`.
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          maxLength: 100
          example: Иван Иванов
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Не менее 8 символов и не более 72 **байт** (ограничение bcrypt).
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
          example: secret123
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh-токен, полученный при входе или предыдущем обновлении.
    UpdateProfileRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
          example: new@example.com
        name:
          type: string
          maxLength: 100
          example: Иван Петров
    UpdatePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          example: secret123
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Не менее 8 символов и не более 72 **байт** (ограничение bcrypt).
          example: newsecret456
    ProfileResponse:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/User'
      required:
        - profile
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Иван Иванов
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - created_at
        - updated_at
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: JWT для заголовка `Authorization`.
        refresh_token:
          type: string
          description: Одноразовый токен для получения новой пары.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Время жизни access-токена в секундах.
          example: 900
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid
        errors:
          type: object
          description: Ключ — имя поля (`email`, `name`, `password`), значение — список сообщений.
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
        - errors
  responses:
    Unauthorized:
      description: |
        Заголовок `Authorization` отсутствует, имеет неверный формат
        (ожидается `Bearer <token>`), либо access-токен недействителен или истёк.
        Клиент должен выполнить `/auth/refresh`.
      headers:
        WWW-Authenticate:
          description: Схема аутентификации
          schema:
            type: string
            example: Bearer realm="api"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    UserNotFound:
      description: Пользователь из токена не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: User not found
    InvalidBody:
      description: Тело запроса не является корректным JSON, содержит неизвестные поля или данные после JSON-объекта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Invalid request body
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Internal Server Error