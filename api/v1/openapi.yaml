openapi: 3.0.3
info:
  title: ICPO Backend API
  description: |
    HTTP API сервиса icpo-backend.

    ## Аутентификация

    Используется пара токенов:

    - **access_token** — JWT (HS256), живёт `JWT_ACCESS_TTL` (по умолчанию 15 минут).
      Передаётся в заголовке `Authorization: Bearer <access_token>`.
    - **refresh_token** — случайная строка, живёт `JWT_REFRESH_TTL` (по умолчанию 720 часов).
      Передаётся **только в HttpOnly-cookie** `refresh_token`: в теле ответа его нет,
      JavaScript его не видит. Cookie ставится в ответах `/auth/login` и `/auth/refresh`
      (`HttpOnly`, `Path=/api/v1/auth`, `SameSite` — по умолчанию `Strict`, `Secure` — по `COOKIE_SECURE`,
      `Max-Age` равен `JWT_REFRESH_TTL`) и удаляется в `/auth/logout`, а также в `/auth/refresh`,
      если токен недействителен.
      В базе хранится только её SHA-256 хэш. Одноразовый: при каждом обновлении
      (`/auth/refresh`) выдаётся новая пара, а старый refresh-токен отзывается.

    Если отозванный refresh-токен предъявить повторно, считается, что он украден:
    отзываются **все** refresh-токены пользователя, и нужно заново войти через `/auth/login`.

    ### Cookie, CORS и CSRF

    `/auth/refresh` и `/auth/logout` аутентифицируются только cookie и не принимают тело запроса:

    - клиент должен отправлять их с `credentials: "include"` (`fetch`) или `withCredentials: true` (XHR, axios);
    - если браузер прислал заголовок `Origin`, он обязан входить в `CORS_ALLOWED_ORIGINS`, иначе `403`
      (запросы без `Origin` — curl, мобильные клиенты — пропускаются);
    - CORS-заголовки (`Access-Control-Allow-Origin`, `Access-Control-Allow-Credentials: true`)
      возвращаются только для origin из белого списка.

    ### Код 401

    - Защищённые эндпоинты: `401` — проблема с access-токеном (отсутствует, неверный формат,
      истёк, недействителен). Клиент должен выполнить `/auth/refresh` и повторить запрос.
    - `/auth/login`: `401` — неверный email или пароль. Обновлять токены в этом случае **не нужно**,
      поэтому interceptor клиента должен исключить `/auth/*` из логики «401 → refresh».
    - `/auth/refresh`: `401` — cookie с refresh-токеном отсутствует или токен недействителен,
      нужен повторный вход через `/auth/login`.

    Неверный старый пароль при смене пароля (`/profile/password`) возвращается как `422`,
    а не `401`, чтобы не запускать обновление токенов.

    Ошибки возвращаются в формате `{"message": "..."}`; ошибки валидации — в формате
    `{"message": "...", "errors": {"поле": ["..."]}}` со статусом `422`.
  version: 0.1.0
servers:
  - url: /
    description: Текущий хост
tags:
  - name: system
    description: Служебные эндпоинты
  - name: auth
    description: Регистрация, вход и управление токенами
  - name: profile
    description: Профиль текущего пользователя (требуется access-токен)
  - name: countries
    description: Справочник стран (требуется access-токен)
  - name: languages
    description: Справочник языков (требуется access-токен)
  - name: crime-categories
    description: Справочник категорий преступлений (требуется access-токен)
  - name: hair-colors
    description: Справочник цветов волос (требуется access-токен)
paths:
  /api/v1/health:
    get:
      tags:
        - system
      summary: Проверка здоровья сервиса
      description: Возвращает статус доступности сервиса.
      operationId: health
      responses:
        '200':
          description: Сервис доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Регистрация пользователя
      description: |
        Создаёт нового пользователя. Email приводится к нижнему регистру,
        пробелы по краям обрезаются. Пароль хранится в виде bcrypt-хэша.

        Токены при регистрации **не выдаются** — для их получения вызовите `/auth/login`.
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              name: Иван Иванов
              password: secret123
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                required:
                  - user
        '400':
          $ref: '#/components/responses/InvalidBody'
        '422':
          description: |
            Ошибка валидации или email уже занят
            (в этом случае `errors.email = ["Email already taken"]`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalid:
                  summary: Некорректные данные
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Field email must be a valid email
                      password:
                        - Field password must have at least 8 characters
                emailTaken:
                  summary: Email уже занят
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Email already taken
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Вход по email и паролю
      description: |
        Проверяет учётные данные и выдаёт пару токенов: access-токен — в теле ответа,
        refresh-токен — в HttpOnly-cookie `refresh_token` (заголовок `Set-Cookie`).
        Для несуществующего email и неверного пароля возвращается одинаковая
        ошибка `401`, чтобы нельзя было определить, зарегистрирован ли email.
        Этот `401` не означает протухший токен — обновлять токены не нужно.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: secret123
      responses:
        '200':
          description: Успешный вход. Refresh-токен установлен в cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid email or password
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Обновление пары токенов
      description: |
        Обменивает refresh-токен из cookie `refresh_token` на новую пару токенов.
        Тело запроса не требуется. Использованный refresh-токен сразу отзывается (ротация):
        новый refresh-токен устанавливается в cookie, access-токен возвращается в теле.

        Возвращает `401`, если cookie отсутствует либо токен не найден, истёк или уже был отозван.
        В случае недействительного токена cookie удаляется. При внутренней ошибке (`500`)
        cookie не изменяется, запрос можно повторить.
        Повторное предъявление **отозванного** токена приводит к отзыву всех
        refresh-токенов пользователя.

        Если запрос содержит заголовок `Origin`, он должен входить в список доверенных, иначе `403`.
        Cross-origin клиенты должны отправлять запрос с `credentials: "include"`.
      operationId: authRefresh
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Новая пара токенов. Новый refresh-токен установлен в cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Cookie с refresh-токеном отсутствует либо токен недействителен, истёк или отозван
          headers:
            Set-Cookie:
              description: Присутствует, только если токен был предъявлен, но недействителен (cookie удаляется).
              schema:
                type: string
                example: refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Выход (отзыв refresh-токена)
      description: |
        Отзывает refresh-токен из cookie `refresh_token` и удаляет cookie.
        Тело запроса не требуется. Операция идемпотентна: если cookie нет, токен не существует
        или уже отозван, всё равно вернётся `204` и cookie будет удалена.

        При внутренней ошибке (`500`) токен может остаться неотозванным, поэтому cookie
        не удаляется и выход можно повторить.

        Уже выданный access-токен продолжает действовать до истечения срока жизни.

        Если запрос содержит заголовок `Origin`, он должен входить в список доверенных, иначе `403`.
        Cross-origin клиенты должны отправлять запрос с `credentials: "include"`.
      operationId: authLogout
      security:
        - refreshCookie: [ ]
        - { }
      responses:
        '204':
          description: Токен отозван, cookie удалена (тело ответа пустое)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile:
    get:
      tags:
        - profile
      summary: Получить профиль текущего пользователя
      description: Возвращает данные пользователя, чей `user_id` указан в access-токене.
      operationId: profileGet
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - profile
      summary: Обновить имя и email
      description: |
        Обновляет email и имя текущего пользователя. Оба поля обязательны.
        Email приводится к нижнему регистру, пробелы по краям обрезаются.
        Если email занят другим пользователем, вернётся `422` с `errors.email`.
      operationId: profileUpdate
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              email: new@example.com
              name: Иван Петров
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          description: |
            Ошибка валидации или email уже занят
            (в этом случае `errors.email = ["Email already taken"]`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalid:
                  summary: Некорректные данные
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Field email must be a valid email
                emailTaken:
                  summary: Email уже занят
                  value:
                    message: The given data was invalid
                    errors:
                      email:
                        - Email already taken
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/profile/password:
    patch:
      tags:
        - profile
      summary: Сменить пароль
      description: |
        Проверяет старый пароль, сохраняет новый (bcrypt) и отзывает
        **все** refresh-токены пользователя. После успешной смены клиенту
        нужно заново войти через `/auth/login`.

        Уже выданные access-токены продолжают действовать до истечения срока жизни.
        Неверный старый пароль возвращается как `422` с `errors.old_password`
        (а не `401`), чтобы клиент не пытался обновлять токены.
      operationId: profileUpdatePassword
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              old_password: secret123
              new_password: newsecret456
      responses:
        '204':
          description: Пароль изменён, refresh-токены отозваны (тело ответа пустое)
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          description: Ошибка валидации или неверный старый пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalid:
                  summary: Некорректные данные
                  value:
                    message: The given data was invalid
                    errors:
                      new_password:
                        - Field new_password must have at least 8 characters
                wrongPassword:
                  summary: Неверный старый пароль
                  value:
                    message: The given data was invalid
                    errors:
                      old_password:
                        - Wrong password
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/countries:
    get:
      tags:
        - countries
      summary: Список стран
      description: |
        Возвращает страницу справочника стран с поиском и сортировкой.

        - `search` — регистронезависимый поиск по подстроке в названии; спецсимволы `%`, `_` и `\`
          трактуются как обычные символы.
        - `sort` — поле сортировки (`id`, `name`, `created_at`), `dir` — направление.
          Без `sort` используется сортировка по `name`. `dir` без `sort` — ошибка `400`.
        - При равных значениях поля порядок дополнительно фиксируется по `id`,
          поэтому строки не дублируются и не пропадают между страницами.
      operationId: countriesList
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Dir'
      responses:
        '200':
          description: Страница списка стран
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefDataListResponse'
              example:
                items:
                  - id: 1
                    name: Россия
                    created_at: '2026-10-22T08:40:22Z'
                  - id: 2
                    name: Франция
                    created_at: '2026-10-22T08:41:05Z'
                total: 2
                page: 1
                per_page: 20
        '400':
          $ref: '#/components/responses/InvalidListParams'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - countries
      summary: Создать страну
      description: |
        Добавляет страну в справочник. Пробелы по краям названия обрезаются.
        Названия уникальны **без учёта регистра**: «Россия» и «россия» — дубликаты.
        При дубликате вернётся `422` с `errors.name`.
      operationId: countriesCreate
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefDataRequest'
            example:
              name: Россия
      responses:
        '201':
          description: Страна создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/RefDataValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/countries/autocomplete:
    get:
      tags:
        - countries
      summary: Автодополнение стран
      description: |
        Возвращает не более 10 стран для подсказок в форме. Совпадения по началу названия
        идут первыми, остальные (по подстроке) — после них, внутри групп — по алфавиту.
        Без `search` возвращаются первые 10 стран по алфавиту.
      operationId: countriesAutocomplete
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Список подсказок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
              example:
                items:
                  - id: 1
                    label: Россия
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/countries/{id}:
    delete:
      tags:
        - countries
      summary: Удалить страну
      description: |
        Удаляет страну из справочника.

        Операция идемпотентна: если страны с таким `id` уже нет, всё равно
        вернётся `204` — повторный вызов `DELETE` не считается ошибкой.
        `404` для этого эндпоинта не возвращается.

        Если на страну ссылаются другие записи (например, города),
        удаление запрещено и вернётся `409`.
      operationId: countriesDelete
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/RefDataId'
      responses:
        '204':
          description: |
            Страна удалена или уже отсутствовала (тело ответа пустое).
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RefDataInUse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/languages:
    get:
      tags:
        - languages
      summary: Список языков
      description: |
        Возвращает страницу справочника языков с поиском и сортировкой.

        - `search` — регистронезависимый поиск по подстроке в названии; спецсимволы `%`, `_` и `\`
          трактуются как обычные символы.
        - `sort` — поле сортировки (`id`, `name`, `created_at`), `dir` — направление.
          Без `sort` используется сортировка по `name`. `dir` без `sort` — ошибка `400`.
        - При равных значениях поля порядок дополнительно фиксируется по `id`,
          поэтому строки не дублируются и не пропадают между страницами.
      operationId: languagesList
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Dir'
      responses:
        '200':
          description: Страница списка языков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefDataListResponse'
              example:
                items:
                  - id: 1
                    name: Русский
                    created_at: '2026-10-22T08:40:22Z'
                  - id: 2
                    name: Французский
                    created_at: '2026-10-22T08:41:05Z'
                total: 2
                page: 1
                per_page: 20
        '400':
          $ref: '#/components/responses/InvalidListParams'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - languages
      summary: Создать язык
      description: |
        Добавляет язык в справочник. Пробелы по краям названия обрезаются.
        Названия уникальны **без учёта регистра**: «Русский» и «русский» — дубликаты.
        При дубликате вернётся `422` с `errors.name`.
      operationId: languagesCreate
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefDataRequest'
            example:
              name: Русский
      responses:
        '201':
          description: Язык создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Language'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/RefDataValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/languages/autocomplete:
